name: THROWAWAY — probe whether a Workers KV namespace can be created from CI

on:
  push:
    branches: [claude/cf-kv-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # A leftover from the first probe run: its delete step used the wrong
      # flag (--force isn't valid for `kv namespace delete`) and failed
      # silently past `|| true`, so this orphaned namespace is still on the
      # account. Clean it up before creating a new one.
      - name: Delete the orphaned namespace from the first probe attempt
        run: npx wrangler kv namespace delete --namespace-id "f47d398ccb97490498af50a3fc8c2ee0" --skip-confirmation || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create a throwaway KV namespace, non-interactively
        run: npx wrangler kv namespace create "grocery-run-kv-probe-${{ github.run_id }}" 2>&1 | tee /tmp/create.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The first attempt's put/get ran against wrangler's LOCAL simulation
      # by mistake ("Resource location: local" in its log) — --remote here
      # is what actually proves the real Cloudflare service works from CI.
      - name: Prove REMOTE read/write works, not wrangler's local simulation
        run: |
          id=$(grep -oE '"?id"?\s*[:=]\s*"[a-f0-9]+"' /tmp/create.log | grep -oE '[a-f0-9]{32}' | head -1)
          echo "namespace id: $id"
          if [ -z "$id" ]; then echo "COULD NOT PARSE NAMESPACE ID — see create.log above"; exit 1; fi
          npx wrangler kv key put --remote --namespace-id "$id" "probe-key" "probe-value"
          got=$(npx wrangler kv key get --remote --namespace-id "$id" "probe-key")
          echo "got: $got"
          [ "$got" = "probe-value" ] || { echo "REMOTE READ DID NOT MATCH WHAT WAS WRITTEN"; exit 1; }
          echo "id=$id" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete the throwaway namespace
        if: always()
        run: npx wrangler kv namespace delete --namespace-id "$id" --skip-confirmation || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
