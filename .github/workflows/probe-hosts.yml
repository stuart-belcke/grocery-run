name: Probe candidate recipe hosts

# TEMPORARY (item 113). This sandbox's egress proxy blocks recipe sites, so a
# candidate host cannot be checked from where the code is written. A runner
# has open internet, so the probe runs here instead. Removed once it has
# answered -- it is a question, not a piece of the build.
on:
  push:
    branches: [claude/recipe-card-link-overflow-ndfkvp]
    paths:
      - "worker/probe/**"
      - ".github/workflows/probe-hosts.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The three the link-walk could not answer
        run: |
          node worker/probe/probe.mjs \
            "https://eatyourselfskinny.com/" \
            "https://www.halfbakedharvest.com/" \
            "https://smittenkitchen.com/" \
            "https://www.loveandlemons.com/"
