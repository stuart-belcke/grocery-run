<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- NO maximum-scale, deliberately. It used to be here to stop iOS Safari
         zooming the page when a <16px field took focus — but it also blocks
         PINCH zoom on Android, for everyone, permanently, which is a WCAG
         1.4.4 failure and takes away the one tool somebody with poor eyesight
         has on any page. The zoom-on-focus is fixed at the source instead:
         every field in the app is 16px, which is the threshold Safari uses,
         so there is nothing left to suppress. See inputStyle in theme.js. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Grocery Run</title>
    <meta name="theme-color" content="#3E6B3A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Grocery Run" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script type="module" crossorigin src="./assets/index-ChNLZwXk.js"></script>
  </head>
  <body style="margin:0">
    <div id="root"></div>
  </body>
</html>
