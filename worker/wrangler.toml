# Deployed by .github/workflows/deploy-worker.yml on every push to main
# that touches worker/**. The name is STABLE (not per-run, unlike the
# throwaway probe this replaced) — the app's client code hardcodes the
# URL this name produces, so renaming it breaks recipe import until the
# app is redeployed too.
name = "grocery-run-recipe-import"
main = "index.js"
compatibility_date = "2026-08-28"

# The per-IP daily rate limit's counter store (index.js: underDailyLimit).
# Created ONCE, by hand, via `wrangler kv namespace create` — this id is
# permanent and account-specific, the same one-time-provisioning shape as
# the workers.dev subdomain registration. Not per-run like the throwaway
# probes' own namespaces were; deleting and recreating this would silently
# reset everyone's daily count to zero.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "aaf256ae3b594fe6ab2fda204ed68578"
